<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Blockchain - Functional Proof</title>

    <!-- Librería oficial de Freighter Wallet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-freighter-api/1.1.2/index.min.js"></script>

    <!-- Enlace a los estilos CSS independientes -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Apex Blockchain MVP</h1>
        <button id="connectWalletBtn" class="btn-primary">Conectar Billetera</button>
    </header>

    <main class="container">
        <section class="card">
            <h2>Estado de la Billetera (Stellar Testnet)</h2>
            <p><strong>Estado:</strong> <span id="walletStatus" class="badge-offline">Desconectado</span></p>
            <p><strong>Clave Pública:</strong> <span id="publicKey">--</span></p>
            <p><strong>Red:</strong> Stellar Testnet</p>
        </section>

        <section class="card">
            <h2>Registrar Operación MVP</h2>
            <form id="txForm">
                <div class="form-group">
                    <label for="destination">Dirección Destino / Cuenta:</label>
                    <input type="text" id="destination" placeholder="G..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Monto / Valor:</label>
                    <input type="number" id="amount" step="0.0001" placeholder="10.0" required>
                </div>
                <button type="submit" id="submitBtn" class="btn-action">Ejecutar Operación</button>
            </form>
        </section>

        <section class="card">
            <h2>Registro de Actividad</h2>
            <pre id="logOutput">Esperando interacción...</pre>
        </section>
    </main>

    <!-- Enlace a la lógica JS independiente -->
    <script src="app.js"></script>
</body>
</html>
